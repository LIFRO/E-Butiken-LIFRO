<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-butiken | Auth Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero__content">
      <p class="eyebrow">E-butiken</p>
      <h1>Register &amp; Log in</h1>
      <p class="lead">Talk to your ASP.NET API at <code id="api-url"></code>.</p>
      <div class="url-input">
        <label for="base-url">API base URL</label>
        <input id="base-url" type="text" value="http://localhost:5001" />
        <button id="save-base">Use URL</button>
      </div>
    </div>
  </header>

  <main class="grid">
    <section class="card">
      <h2>Create account</h2>
      <form id="register-form">
        <label>
          Name
          <input name="name" type="text" required placeholder="Your name">
        </label>
        <label>
          Email
          <input name="email" type="email" required placeholder="you@example.com">
        </label>
        <label>
          Password
          <input name="password" type="password" required minlength="3" placeholder="••••••">
        </label>
        <button type="submit">Register</button>
      </form>
      <div class="status" id="register-status"></div>
    </section>

    <section class="card">
      <h2>Log in</h2>
      <form id="login-form">
        <label>
          Email
          <input name="email" type="email" required placeholder="you@example.com">
        </label>
        <label>
          Password
          <input name="password" type="password" required minlength="3" placeholder="••••••">
        </label>
        <button type="submit">Log in</button>
      </form>
      <div class="status" id="login-status"></div>
    </section>

    <section class="card card--accent">
      <h2>Current session</h2>
      <p id="session-info">Not logged in.</p>
      <button id="clear-session" class="ghost">Clear session</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
